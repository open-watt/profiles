#
# Xiaomi LYWSD03MMC Temperature & Humidity Sensor
#
# Custom firmware (pvvx ATC) notification characteristic:
#   Service:  ebe0ccb0-7a0a-4b0c-8a1a-6ff2997da3a6
#   Char:     ebe0ccc1-7a0a-4b0c-8a1a-6ff2997da3a6
#   Payload:  [s16 temp (0.01C)] [u8 humidity %] [u16 voltage mV]
#
# Standard services:
#   180A (Device Information) / 2A29 (Manufacturer Name)
#   180F (Battery Service)   / 2A19 (Battery Level)
#

elements:
	ble: ebe0ccb0-7a0a-4b0c-8a1a-6ff2997da3a6, ebe0ccc1-7a0a-4b0c-8a1a-6ff2997da3a6(0), s16:0.01C	desc: temperature, deg-C, report, "Temperature"
	ble: ebe0ccb0-7a0a-4b0c-8a1a-6ff2997da3a6, ebe0ccc1-7a0a-4b0c-8a1a-6ff2997da3a6(2), u8:%		desc: humidity, %, report, "Humidity"
	ble: ebe0ccb0-7a0a-4b0c-8a1a-6ff2997da3a6, ebe0ccc1-7a0a-4b0c-8a1a-6ff2997da3a6(3), u16:mV		desc: battery_voltage, mV, low, "Battery Voltage"
	ble: 180F, 2A19, u8:%		desc: battery, %, low, "Battery Level"

	# Manufacturer Name and Model Number are variable-length GATT strings. Add them once
	# their observed bounds can be expressed as canonical strN descriptors.

device-template:
	component:
		id: info
		template: DeviceInfo
	component:
		id: environment
		element-map: temperature, @temperature
		element-map: humidity, @humidity
	component:
		id: battery
		element-map: level, @battery
		element-map: voltage, @battery_voltage
