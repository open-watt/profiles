	goodwe-rtu: 45443, 124, u16:0.1V, RW desc: safety_high_ride_through_start_point, V, low, "Voltage"
		write: modbus, 45505
		range: 100V, 300V
		invalid: 0xFFFF
	goodwe-rtu: 45443, 126, u16:0.1V, RW desc: safety_high_ride_through_end_point, V, low, "Voltage"
		write: modbus, 45506
		range: 100V, 300V
		invalid: 0xFFFF
	goodwe-rtu: 45443, 128, u16, RW desc: safety_high_start_point_protection_time, , low, "Grid cycles; divide by nominal country frequency, not live frequency; extended-time bank may override"
		write: modbus, 45507
		range: 1, 50000
	goodwe-rtu: 45443, 130, u16, RW desc: safety_high_end_point_protection_time, , low, "Grid cycles; divide by nominal country frequency, not live frequency; extended-time bank may override"
		write: modbus, 45508
		range: 1, 50000
	goodwe-rtu: 45443, 132, u16:0.1V, RW desc: safety_high_ride_through_limit, V, low, "Voltage"
		write: modbus, 45509
		range: 230V, 300V
		invalid: 0xFFFF
	goodwe-rtu: 45526, 0, u16, RW desc: safety_pq_curve_switch, , low, "Boolean code"
		write: modbus, 45526
		range: 0, 1
		invalid: 0xFFFF
	goodwe-rtu: 45526, 2, u16 desc: safety_p1_gen_active_power, , low, "Raw register; source units require decoder validation"
	goodwe-rtu: 45526, 4, u16 desc: safety_q1_gen_reactive_power, , low, "Raw register; source units require decoder validation"
	goodwe-rtu: 45526, 6, u16 desc: safety_p2_gen_active_power, , low, "Raw register; source units require decoder validation"
	goodwe-rtu: 45526, 8, u16 desc: safety_q2_gen_reactive_power, , low, "Raw register; source units require decoder validation"
	goodwe-rtu: 45526, 10, u16 desc: safety_p3_gen_active_power, , low, "Raw register; source units require decoder validation"
	goodwe-rtu: 45526, 12, u16 desc: safety_q3_gen_reactive_power, , low, "Raw register; source units require decoder validation"
	goodwe-rtu: 45526, 14, u16 desc: safety_p1_load_active_power, , low, "Raw register; source units require decoder validation"
	goodwe-rtu: 45526, 16, u16 desc: safety_q1_load_reactive_power, , low, "Raw register; source units require decoder validation"
	goodwe-rtu: 45526, 18, u16 desc: safety_p2_load_active_power, , low, "Raw register; source units require decoder validation"
	goodwe-rtu: 45526, 20, u16 desc: safety_q2_load_reactive_power, , low, "Raw register; source units require decoder validation"
	goodwe-rtu: 45526, 22, u16 desc: safety_p3_load_active_power, , low, "Raw register; source units require decoder validation"
	goodwe-rtu: 45526, 24, u16 desc: safety_q3_load_reactive_power, , low, "Raw register; source units require decoder validation"

	aa55: 9, 44, u16:0.1V desc: stat_float_voltage, V, low, "Lead-acid floating voltage"
	aa55: 9, 46, u16 desc: stat_float_current_raw, , low, "Conditional floating current code"
	aa55: 9, 48, u16 desc: stat_float_time_raw, , low, "Conditional floating time code"
	aa55: 9, 50, u16 desc: stat_battery_index, , low, "Battery catalogue index"


	aa55: 0x5e, 0, u16, RW desc: action_clear_overload, , ondemand, "Increment to request overload history clear; ACK only"
		command: 3, 0x5e, 0xde, 0f
	aa55: 0x26, 0, u16, RW desc: action_cold_start_enable, , ondemand, "Increment to request first off-grid cold start; backup must be enabled; ACK only"
		command: 3, 0x26, 0xa6, 04
	aa55: 0x26, 0, u16, RW desc: action_cold_start_disable, , ondemand, "Increment to cancel first off-grid cold start; ACK only"
		command: 3, 0x26, 0xa6, 01

	# Communication-module reads use separate 5A5A framing and payload schemas.
	goodwe-module: 4, 0, str desc: module_server1_status, , low
		request-byte: 1
		field: status,0

	goodwe-module: 4, 0, str desc: module_server2_status, , low
		request-byte: 2
		field: status,0

	goodwe-module: 5, 0, u8 desc: module_packets_channel, , low
		request-byte: 1

	goodwe-module: 5, 1, u16 desc: module_packets_sent, , low
		request-byte: 1

	goodwe-module: 5, 3, u16 desc: module_packets_received, , low
		request-byte: 1

	goodwe-module: 0x01, 0, str desc: module_firmware, , low, "Communication module firmware"
	goodwe-module: 0x03, 0, str desc: module_network_mode, , low, "Module address mode"
		field: csv, 0
	goodwe-module: 0x03, 0, str desc: module_ip_address, , low, "Module IP address"
		field: csv, 1
	goodwe-module: 0x03, 0, str desc: module_netmask, , low, "Module subnet mask"
		field: csv, 2
	goodwe-module: 0x03, 0, str desc: module_gateway, , low, "Module gateway"
		field: csv, 3
	goodwe-module: 0x03, 0, str desc: module_dns, , low, "Module DNS server"
		field: csv, 4

device-template:
	model: GW3648~C~D~-ES, GW5048~C~D~-ES
	component:
		id: info
		template: DeviceInfo
		element: type, "inverter"
		element: name, "GW5048-ES" [GW5048*]
		element: manufacturer_name, "GoodWe"
		element-map: model_id, @id_model_name
		element-map: serial_number, @id_serial_number
		element-map: firmware_version, @id_firmware_version
		element-map: software_version, @id_software_version
		component:
			id: battery
			element-map: serial_number, @bms_serial
			element-map: bms_version, @bms_version
	component:
		id: status
		template: DeviceStatus
		component:
			id: protocol
			hidden: true
			element-map: identity, @legacy_identity_block
			element-map: runtime, @legacy_runtime_block
			element-map: settings, @legacy_settings_block
			element-map: tou1, @legacy_tou1_block
			element-map: tou2, @legacy_tou2_block
			element-map: tou3, @legacy_tou3_block
			element-map: tou4, @legacy_tou4_block
		element-map: time, @data_time
		element-map: running_time, @data_h_total
		element-map: operating_mode, @data_work_mode
		element-map: effective_work_mode, @data_effective_work_mode
		element-map: relay_control, @data_effective_relay_control
		element-map: error_codes, @data_error_codes
		element-map: diagnostics, @data_diagnose_result
		element-map: ems_mode, @ems_mode
		element-map: ems_power, @ems_power
		component:
			id: communication_module
			element-map: firmware, @module_firmware
			element-map: server1_status, @module_server1_status
			element-map: server2_status, @module_server2_status
			component:
				id: packets
				element-map: channel, @module_packets_channel
				element-map: sent, @module_packets_sent
				element-map: received, @module_packets_received

			component:
				id: network
				element-map: mode, @module_network_mode
				element-map: address, @module_ip_address
				element-map: netmask, @module_netmask
				element-map: gateway, @module_gateway
				element-map: dns, @module_dns
	component:
		id: hidden
		hidden: true
		element-map: bat_current_raw, @data_i_bat
		element-map: pv1_state_raw, @data_pv1_state
		element-map: pv2_state_raw, @data_pv2_state
		element-map: power_factor_raw, @stat_power_factor
		element-map: charging_current_bulk_raw, @stat_charge_i
		element-map: discharging_current_bulk_raw, @stat_discharge_i
		element-map: data_p_grid, @data_p_grid
		element-map: data_grid_in_out, @data_grid_in_out
		element-map: data_p_load, @data_p_load
		element-map: data_total_plant_consumption, @data_total_plant_consumption
		element-map: data_total_power, @data_total_power
	component:
		id: grid
		template: Port
		element: role, "grid"
		element: flow, "bidirectional"
		element: meter_sign, "inverted"
		component:
			id: meter
			template: EnergyMeter
			element: type, "single-phase"
			element-map: voltage, @data_v_grid
			element: power, @inverter.load.power - @backup.meter.power
			element: reactive, @inverter.load.reactive - @backup.meter.reactive
			element: apparent, $energy.apparent(@grid.meter.power, @grid.meter.reactive)
			element: current, $select(@grid.meter.voltage > 0, @grid.meter.apparent / @grid.meter.voltage, 0)
			element-map: frequency, @data_f_grid
	component:
		id: backup
		template: Port
		element: role, "backup"
		element: flow, "bidirectional"
		element: meter_sign, "inverted"
		component:
			id: meter
			template: EnergyMeter
			element: type, "single-phase"
			element-map: voltage, @data_v_backup
			element-map: current, @data_i_backup
			element-map: power, @data_p_backup
			element: apparent, @backup.meter.voltage * @backup.meter.current
			element: reactive, $energy.reactive(@backup.meter.apparent, @backup.meter.power)
			element-map: frequency, @data_f_backup
	component:
		id: battery
		template: Port
		element: role, "battery"
		element: flow, "bidirectional"
		component:
			id: meter
			template: EnergyMeter
			element: type, "dc"
			element-map: voltage, @data_v_bat
			element: current, $select(@battery.store.mode == 3, -@hidden.bat_current_raw, @hidden.bat_current_raw)
			element: power, @battery.meter.voltage * @battery.meter.current
			element-sum: import, positive_trapezoid, @battery.meter.power
			element-sum: export, negative_trapezoid, @battery.meter.power
		component:
			id: store
			template: Battery
			element-map: mode, @data_bat_mode
			element-map: soc, @data_soc
			element-map: soh, @data_soh
			element-map: temp, @data_c_bat_temp
			element-map: max_charge_current, @data_i_bat_charge
			element-map: max_discharge_current, @data_i_bat_discharge
	component:
		id: solar
		template: Solar
		component:
			id: mppt1
			template: Port
			element: role, "pv"
			element: flow, "supply"

			component:
				id: meter
				template: EnergyMeter
				element: type, "dc"
				element-map: voltage, @data_v_pv1
				element-map: current, @data_i_pv1
				element: power, @solar.mppt1.meter.voltage * @solar.mppt1.meter.current
				element-sum: net, trapezoid, @solar.mppt1.meter.power
		component:
			id: mppt2
			template: Port
			element: role, "pv"
			element: flow, "supply"

			component:
				id: meter
				template: EnergyMeter
				element: type, "dc"
				element-map: voltage, @data_v_pv2
				element-map: current, @data_i_pv2
				element: power, @solar.mppt2.meter.voltage * @solar.mppt2.meter.current
				element-sum: net, trapezoid, @solar.mppt2.meter.power
		component:
			id: meter
			template: EnergyMeter
			element: type, "dc"
			element: power, @solar.mppt1.meter.power + @solar.mppt2.meter.power
			element-sum: net, trapezoid, @solar.meter.power
	component:
		id: inverter
		template: Inverter
		element: rated_power, 5000W	[GW5048*]
		element: efficiency, 95.5%
		element-map: data_load_mode, @data_load_mode
		element-map: data_work_mode, @data_work_mode
		element-map: temp, @data_c_inverter_temp
		component:
			id: control
			template: PowerControl
			# kind, enable and setpoint are created by goodwe-control with their authoritative formats.
			element: direction, "bidirectional"
			element: unit, "W"
			element-map: mode, @ems_mode
			element-map: power_limit, @ems_power
		component:
			id: export_meter
			template: EnergyMeter
			element: type, "single-phase"
			element-map: voltage, @data_v_grid
			element: power, @grid.meter.power - @hidden.data_p_load
			element-map: frequency, @data_f_grid
		component:
			id: load
			template: EnergyMeter
			element: type, "single-phase"
			element-map: voltage, @data_v_grid
			element-map: current, @data_i_grid
			element-map: power, @data_total_power
			element: apparent, @inverter.load.voltage * @inverter.load.current
			element: reactive, $energy.reactive(@inverter.load.apparent, @inverter.load.power)
			element-map: frequency, @data_f_grid
	component:
		id: config
		component:
			id: meter_ct_detection
			element-map: status_code, @ct_check_status
			element-map: result_code, @ct_check_result
			element-map: start_request, @action_ct_check_start
			element-map: stop_request, @action_ct_check_stop
		component:
			id: communication
			component:
				id: apn
				element-map: name, @app_apn_name
			component:
				id: wlan_lan
				component:
					id: configure
					element-map: mode, @app_module_config_mode
					element-map: address, @app_module_config_address
					element-map: netmask, @app_module_config_netmask
					element-map: gateway, @app_module_config_gateway
					element-map: dns, @app_module_config_dns
					element-map: ssid, @app_module_config_ssid
					element-map: encryption, @app_module_config_encryption
					element-map: router_password, @app_module_config_router_password
				component:
					id: password
					element-map: new_password, @app_module_new_password
				element-alias: mode, @status.communication_module.network.mode
				element-alias: address, @status.communication_module.network.address
				element-alias: netmask, @status.communication_module.network.netmask
				element-alias: gateway, @status.communication_module.network.gateway
				element-alias: dns, @status.communication_module.network.dns
		component:
			id: basic
			component:
				id: grid_code
				element-map: code, @id_safety_country_code
			component:
				id: working_mode
				element-map: mode, @stat_work_mode
				component: [GW5048D-ES]
					id: activation
					element-map: requested_mode, @app_legacy_mode_request
			component:
				id: battery_model
				element-map: capacity, @stat_capacity
				element-map: protocol, @stat_bp_bms_protocol
				element-map: index, @stat_battery_index
				component:
					id: self_define
					element-map: floating_voltage, @stat_float_voltage
					element-map: floating_current_raw, @stat_float_current_raw
					element-map: floating_time_raw, @stat_float_time_raw
			component:
				id: tou
				component:
					id: time1
					element-map: state, @tou1_state
					element-map: start_hour, @tou1_start_hour
					element-map: start_minute, @tou1_start_minute
					element-map: end_hour, @tou1_end_hour
					element-map: end_minute, @tou1_end_minute
					element-map: delete, @tou1_delete
					element-map: enabled_raw, @tou1_enabled_raw
					element-map: weekdays, @tou1_weekdays
					element-map: power, @tou1_power
					element-map: cutoff_soc, @tou1_cutoff_soc
					element-map: reserved, @tou1_reserved
				component:
					id: time2
					element-map: state, @tou2_state
					element-map: start_hour, @tou2_start_hour
					element-map: start_minute, @tou2_start_minute
					element-map: end_hour, @tou2_end_hour
					element-map: end_minute, @tou2_end_minute
					element-map: delete, @tou2_delete
					element-map: enabled_raw, @tou2_enabled_raw
					element-map: weekdays, @tou2_weekdays
					element-map: power, @tou2_power
					element-map: cutoff_soc, @tou2_cutoff_soc
					element-map: reserved, @tou2_reserved
				component:
					id: time3
					element-map: state, @tou3_state
					element-map: start_hour, @tou3_start_hour
					element-map: start_minute, @tou3_start_minute
					element-map: end_hour, @tou3_end_hour
					element-map: end_minute, @tou3_end_minute
					element-map: delete, @tou3_delete
					element-map: enabled_raw, @tou3_enabled_raw
					element-map: weekdays, @tou3_weekdays
					element-map: power, @tou3_power
					element-map: cutoff_soc, @tou3_cutoff_soc
					element-map: reserved, @tou3_reserved
				component:
					id: time4
					element-map: state, @tou4_state
					element-map: start_hour, @tou4_start_hour
					element-map: start_minute, @tou4_start_minute
					element-map: end_hour, @tou4_end_hour
					element-map: end_minute, @tou4_end_minute
					element-map: delete, @tou4_delete
					element-map: enabled_raw, @tou4_enabled_raw
					element-map: weekdays, @tou4_weekdays
					element-map: power, @tou4_power
					element-map: cutoff_soc, @tou4_cutoff_soc
					element-map: reserved, @tou4_reserved
		component:
			id: advanced
			element-map: clear_overload, @action_clear_overload
			component:
				id: cold_start
				element-map: enable_request, @action_cold_start_enable
				element-map: disable_request, @action_cold_start_disable
			element-map: dred, @dred
			element-map: software_power_limit, @stat_grid_export
			element-map: power_limit, @stat_grid_export_limit
			element-map: hardware_power_limit, @hardware_power_limit
			element-map: shadow_scan, @stat_shadow_scan
			element-map: backup, @stat_backup_supply
			element-map: detection_mode, @stat_grid_quality_check
			element-map: battery_activated, @stat_battery_activated
			element: power_factor, $select(@hidden.power_factor_raw >= 0 && @hidden.power_factor_raw <= 20, @hidden.power_factor_raw * 0.01 - 1, @hidden.power_factor_raw * 0.01)
			element-map: output_active_power, @output_active_power
			component:
				id: battery_function
				element-map: charging_voltage, @stat_charge_v
				element-map: charging_current, @configured_charge_current
				element-map: discharging_current, @configured_discharge_current
				element-map: discharge_voltage, @stat_discharge_v
				element-map: soc_protection_raw, @stat_battery_soc_protection
				element-map: on_grid_min_soc, @stat_dod
				element-map: off_grid_min_soc, @off_grid_min_soc
				element-map: immediate_charging, @immediate_charging
				element-map: charge_cutoff_soc, @charge_cutoff_soc
			component:
				id: safety
				component:
					id: protection
					element-map: over_voltage_level_1_phase, @safety_over_voltage_level_1_phase
					element-map: over_voltage_level_1_time_phase_cycles, @safety_over_voltage_level_1_time_phase
					element-map: under_voltage_level_1_phase, @safety_under_voltage_level_1_phase
					element-map: under_voltage_level_1_time_phase_cycles, @safety_under_voltage_level_1_time_phase
					element-map: over_voltage_level_2_phase, @safety_over_voltage_level_2_phase
					element-map: over_voltage_level_2_time_phase_cycles, @safety_over_voltage_level_2_time_phase
					element-map: under_voltage_level_2_phase, @safety_under_voltage_level_2_phase
					element-map: under_voltage_level_2_time_phase_cycles, @safety_under_voltage_level_2_time_phase
					element-map: over_voltage_phase_10min, @safety_over_voltage_phase_10min
					element-map: over_frequency_level_1, @safety_over_frequency_level_1
					element-map: over_frequency_level_1_time_cycles, @safety_over_frequency_level_1_time
					element-map: under_frequency_level_1, @safety_under_frequency_level_1
					element-map: under_frequency_level_1_time_cycles, @safety_under_frequency_level_1_time
					element-map: over_frequency_level_2, @safety_over_frequency_level_2
					element-map: over_frequency_level_2_time_cycles, @safety_over_frequency_level_2_time
					element-map: under_frequency_level_2, @safety_under_frequency_level_2
					element-map: under_frequency_level_2_time_cycles, @safety_under_frequency_level_2_time
				component:
					id: connection
					element-map: connect_voltage_upper_limit, @safety_connect_voltage_upper_limit
					element-map: connect_voltage_lower_limit, @safety_connect_voltage_lower_limit
					element-map: connect_frequency_upper_limit, @safety_connect_frequency_upper_limit
					element-map: connect_frequency_lower_limit, @safety_connect_frequency_lower_limit
					element-map: grid_connect_wait_time, @safety_grid_connect_wait_time
					element-map: connect_voltage_upper_fault, @safety_connect_voltage_upper_fault
					element-map: connect_voltage_lower_fault, @safety_connect_voltage_lower_fault
					element-map: connect_frequency_upper_fault, @safety_connect_frequency_upper_fault
					element-map: connect_frequency_lower_fault, @safety_connect_frequency_lower_fault
					element-map: grid_wait_time_lower_fault, @safety_grid_wait_time_lower_fault
					element-map: grid_frequency_wait_time_lower_fault, @safety_grid_frequency_wait_time_lower_fault
					element-map: grid_connect_power_rate, @safety_grid_connect_power_rate
					element-map: grid_connect_power_rate_under_fault, @safety_grid_connect_power_rate_under_fault
					element-map: power_slope_enable, @safety_power_slope_enable
				component:
					id: curves
					element-map: fp_curve, @safety_fp_curve
					element-map: of_start_point, @safety_of_start_point
					element-map: uf_start_point, @safety_uf_start_point
					element-map: of_end_point, @safety_of_end_point
					element-map: uf_end_point, @safety_uf_end_point
					element-map: recovery_wait_time, @safety_recovery_wait_time
					element-map: recovery_high_frequency, @safety_recovery_high_frequency
					element-map: recovery_low_frequency, @safety_recovery_low_frequency
					element-map: recovery_slope, @safety_recovery_slope
					element-map: fp_setting_raw, @safety_fp_setting
					element-map: of_power_slope, @safety_of_power_slope
					element-map: uf_power_slope, @safety_uf_power_slope
					element-map: recovery_power_slope, @safety_recovery_power_slope
					element-map: reactive_qu_raw, @safety_reactive_qu
					element-map: reactive_qu_seconds, @safety_reactive_qu_seconds
					element-map: cos_qu_raw, @safety_cos_qu
					element-map: cos_qu_seconds, @safety_cos_qu_seconds
					element-map: active_pu_raw, @safety_active_pu
					element-map: active_pu_seconds, @safety_active_pu_seconds
					element-map: response_time_raw, @safety_response_time
					element-map: cos_curve, @safety_cos_curve
					element-map: power_point_a, @safety_power_point_a
					element-map: power_point_a_cos, @safety_power_point_a_cos
					element-map: power_point_b, @safety_power_point_b
