#
# Generic OBD-II (SAE J1979) vehicle profile
#
# Standard mode-01 pids over the functional broadcast address; works on any
# OBD-II compliant vehicle. Pids the vehicle does not implement are filtered
# by the binding's supported-pid discovery.
#
# Legend:
#   obd: mode, pid, offset, type [, ecu=<id>]
#
# Temperature pids (coolant 0x05, intake 0x0F, ambient 0x46) are biased A-40
# and wait on bias support in the value-spec grammar.
#

elements:
	obd: 0x01, 0x04, 0, u8:0.392%		desc: engine_load, %, high, "Engine Load"
	obd: 0x01, 0x0C, 0, u16:0.25/min	desc: engine_rpm, rpm, realtime, "Engine RPM"
	obd: 0x01, 0x0D, 0, u8:km/h			desc: speed, km/h, realtime, "Vehicle Speed"
	obd: 0x01, 0x10, 0, u16:0.01g/s		desc: maf, g/s, high, "Mass Air Flow"
	obd: 0x01, 0x11, 0, u8:0.392%		desc: throttle, %, high, "Throttle Position"
	obd: 0x01, 0x1F, 0, u16:s			desc: run_time, s, low, "Run Time Since Start"
	obd: 0x01, 0x21, 0, u16:km			desc: distance_mil, km, low, "Distance With MIL On"
	obd: 0x01, 0x2F, 0, u8:0.392%		desc: fuel_level, %, low, "Fuel Level"
	obd: 0x01, 0x31, 0, u16:km			desc: distance_cleared, km, low, "Distance Since Codes Cleared"
	obd: 0x01, 0x42, 0, u16:mV			desc: module_voltage, V, medium, "Control Module Voltage"
	obd: 0x09, 0x02, 1, str17			desc: vin, , const, "VIN"

device-template:
	component:
		id: info
		template: DeviceInfo
		element: type, "vehicle"
		element-map: vin, @vin
	component:
		id: drivetrain
		element-map: rpm, @engine_rpm
		element-map: speed, @speed
		element-map: load, @engine_load
		element-map: throttle, @throttle
		element-map: run_time, @run_time
	component:
		id: fuel
		element-map: level, @fuel_level
		element-map: maf, @maf
	component:
		id: battery
		element-map: voltage, @module_voltage
	component:
		id: service
		element-map: distance_mil, @distance_mil
		element-map: distance_cleared, @distance_cleared
