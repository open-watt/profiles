#
# MG ZS EV vehicle profile
#
# Everything here is read from the VCU at 0x7E3 (replies 0x7EB) using UDS
# ReadDataByIdentifier. On this vehicle the OBD gateway exposes exactly one
# diagnostically reachable ECU: an enumeration of every request address in
# 0x700-0x7FF answered only at 0x7DF and 0x7E3. The BMS documented at 0x781 in
# older MG datasets does not respond here, with the CAN receive filter fully
# open (ATCF 000 / ATCM 000), so pack SOC is not reachable by that route.
#
# Legend:
#   obd: mode, pid, offset, type [, ecu=<id>]
#
# The did space was enumerated by sweeping 0xB000-0xBFFF at 0x7E3; unsupported
# dids answer 0x7F 0x22 0x31, so the 111 dids below are an exhaustive map of
# the page rather than a guess. Dids whose meaning is not yet established are
# carried raw and hidden: polling them records a history that can be diffed
# across vehicle states (parked, charging, ready, driving) to identify them.
#
# Signals biased by a zero point (speed BA00 is (raw-20000)/100, and the pack
# currents use 20000/32767/40000 offsets) are carried raw pending bias support
# in the value-spec grammar, as the J1979 A-40 temperatures are.
#

elements:
	obd: 0x22, 0xB000, 0, u8, ecu=0x7E3							desc: did_b000, , low, "Unknown B000"
	obd: 0x22, 0xB001, 0, u8, ecu=0x7E3							desc: did_b001, , low, "Unknown B001"
	obd: 0x22, 0xB002, 0, u8, ecu=0x7E3							desc: did_b002, , low, "Unknown B002"
